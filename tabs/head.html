<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%232c1f14'/><text x='16' y='23' font-family='Georgia,serif' font-size='22' font-weight='700' fill='%23e85d3a' text-anchor='middle'>E</text></svg>"><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>ELEVATE — Daily Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400&family=Bricolage+Grotesque:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{
  --cream:#faf7f2; --cream2:#f4efe6; --cream3:#ede5d8;
  --warm:#e8dcc8; --warmD:#d4c4a8;
  --text:#1a1510; --text2:#6b5c48; --text3:#a8967c; --text4:#c4b49a;
  --coral:#e85d3a; --coral2:#f07a5c; --coralL:#fde8e2;
  --sage:#3a7a5a; --sage2:#5a9a7a; --sageL:#e2f0ea;
  --amber:#d4821a; --amberL:#fef3e2;
  --sky:#2a6a9a; --skyL:#e2eef8;
  --plum:#7a3a6a; --plumL:#f0e2ec;
  --rose:#c44a6a; --roseL:#fce8ee;
  --ink:#2c1f14;
  --shadow:0 2px 12px rgba(26,21,16,0.08);
  --shadow2:0 8px 40px rgba(26,21,16,0.12);
  --r:14px; --r2:10px; --r3:8px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--cream);color:var(--text);font-family:'Bricolage Grotesque',sans-serif;min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;
  background:radial-gradient(ellipse 70% 50% at 10% 0%,rgba(232,93,58,0.06),transparent 60%),
             radial-gradient(ellipse 50% 60% at 90% 100%,rgba(58,122,90,0.07),transparent 60%);
  pointer-events:none;z-index:0;}
#app{position:relative;z-index:1;max-width:1320px;margin:0 auto;padding:28px 24px 80px;}

/* NAV */
nav{display:flex;flex-direction:column;gap:16px;padding:0 0 28px;border-bottom:2px solid var(--warm);margin-bottom:32px;animation:slideDown .5s ease both;}
.nav-toprow{display:flex;align-items:center;justify-content:flex-start;flex-wrap:wrap;gap:22px;}
.logo{font-family:'Fraunces',serif;font-size:26px;font-weight:700;color:var(--ink);letter-spacing:-.5px;}
.logo em{color:var(--coral);font-style:italic;}
.nav-sub{font-size:12px;color:var(--text3);'font-family:\\'JetBrains Mono\\',monospace"';letter-spacing:.05em;text-transform:uppercase;margin-top:2px;}
.nav-tabs{display:flex;gap:6px;background:var(--cream2);border-radius:50px;padding:5px;border:1.5px solid var(--warm);
  width:100%;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:thin;}
.nav-tab{padding:9px 18px;border-radius:50px;border:none;background:transparent;font-family:'Bricolage Grotesque',sans-serif;font-size:14px;font-weight:500;color:var(--text2);cursor:pointer;transition:all .2s;white-space:nowrap;flex-shrink:0;}
.nav-tab.active{background:#fff;color:var(--text);box-shadow:var(--shadow);font-weight:600;}

/* SCORE AREA */
.hero{display:grid;grid-template-columns:240px 1fr 260px;gap:20px;margin-bottom:28px;animation:fadeUp .4s ease .1s both;}
.score-card{background:#fff;border:1.5px solid var(--warm);border-radius:var(--r);padding:28px 20px;text-align:center;box-shadow:var(--shadow);}
.ring-wrap{position:relative;width:130px;height:130px;margin:0 auto 14px;}
.ring-wrap svg{transform:rotate(-90deg);}
.ring-bg{fill:none;stroke:var(--cream3);stroke-width:11;}
.ring-fg{fill:none;stroke-width:11;stroke-linecap:round;stroke:url(#rg);transition:stroke-dashoffset 1.2s cubic-bezier(.4,0,.2,1);}
.ring-num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.ring-pct{font-family:'Fraunces',serif;font-size:36px;font-weight:700;color:var(--ink);line-height:1;}
.ring-lbl{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.1em;margin-top:2px;}
.score-emoji{font-size:24px;margin-bottom:6px;}
.score-msg{font-size:14px;font-weight:600;color:var(--text2);}

/* Quick metrics */
.metrics-bar{background:#fff;border:1.5px solid var(--warm);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;}
.metric-row{display:flex;align-items:center;gap:10px;}
.metric-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}
.metric-info{flex:1;}
.metric-name{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;font-weight:500;}
.metric-val{font-family:'Fraunces',serif;font-size:18px;font-weight:600;color:var(--ink);line-height:1.2;}
.metric-bar{height:4px;background:var(--cream3);border-radius:4px;overflow:hidden;margin-top:3px;}
.metric-bar-fill{height:100%;border-radius:4px;transition:width .6s;}

/* Adal card */
.adal-card{background:#fff;border:1.5px solid var(--warm);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);cursor:pointer;transition:all .2s;}
.adal-card:hover{border-color:var(--coral);box-shadow:0 4px 20px rgba(232,93,58,0.12);}
.adal-top{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
.adal-badge{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;}
.adal-badge.ok{background:var(--sageL);}
.adal-badge.soon{background:var(--amberL);animation:wobble 2s infinite;}
.adal-badge.today,.adal-badge.overdue{background:var(--coralL);animation:pulse 1.2s infinite;}
.adal-badge.unknown{background:var(--cream2);}
.adal-title{font-family:'Fraunces',serif;font-size:15px;font-weight:600;}
.adal-msg{font-size:13px;color:var(--text2);margin-bottom:8px;}
.adal-progress{height:6px;background:var(--cream3);border-radius:6px;overflow:hidden;}
.adal-progress-fill{height:100%;border-radius:6px;transition:width .5s;background:linear-gradient(90deg,var(--sage2),var(--sage));}
.adal-dates{display:flex;justify-content:space-between;margin-top:5px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text4);}

/* FORM SECTIONS */
.sections{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px;margin-bottom:24px;}
.card{background:#fff;border:1.5px solid var(--warm);border-radius:var(--r);padding:22px;box-shadow:var(--shadow);transition:border-color .2s;animation:fadeUp .4s ease both;}
.card:hover{border-color:var(--warmD);}
.card-head{display:flex;align-items:center;gap:10px;margin-bottom:18px;padding-bottom:14px;border-bottom:1.5px solid var(--cream2);}
.card-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.card-title{font-family:'Fraunces',serif;font-size:16px;font-weight:600;line-height:1.2;}
.card-sub{font-size:11px;color:var(--text3);margin-top:1px;}
.card-full{grid-column:1/-1;}

/* Field label */
.flabel{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;}
.fgroup{margin-bottom:16px;}
.fgroup:last-child{margin-bottom:0;}

/* CHIP BUTTONS - the main interaction paradigm */
.chips{display:flex;gap:6px;flex-wrap:wrap;}
.chip{
  padding:8px 14px;border-radius:50px;border:1.5px solid var(--cream3);
  background:var(--cream);color:var(--text2);font-family:'Bricolage Grotesque',sans-serif;
  font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;white-space:nowrap;
  display:flex;align-items:center;gap:5px;
}
.chip:hover{border-color:var(--warmD);background:#fff;transform:translateY(-1px);}
.chip.sel-coral{background:var(--coral);border-color:var(--coral);color:#fff;box-shadow:0 3px 12px rgba(232,93,58,.3);}
.chip.sel-sage{background:var(--sage);border-color:var(--sage);color:#fff;box-shadow:0 3px 12px rgba(58,122,90,.3);}
.chip.sel-amber{background:var(--amber);border-color:var(--amber);color:#fff;box-shadow:0 3px 12px rgba(212,130,26,.3);}
.chip.sel-sky{background:var(--sky);border-color:var(--sky);color:#fff;box-shadow:0 3px 12px rgba(42,106,154,.3);}
.chip.sel-plum{background:var(--plum);border-color:var(--plum);color:#fff;box-shadow:0 3px 12px rgba(122,58,106,.3);}
.chip.sel-rose{background:var(--rose);border-color:var(--rose);color:#fff;box-shadow:0 3px 12px rgba(196,74,106,.3);}
.chip.sel-ink{background:var(--ink);border-color:var(--ink);color:#fff;}

/* SMART NUMBER INPUT - slider + presets */
.smart-input{background:var(--cream2);border-radius:var(--r2);padding:14px;border:1.5px solid var(--cream3);}
.smart-presets{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px;}
.preset{padding:5px 11px;border-radius:50px;border:1.5px solid var(--cream3);background:#fff;
  font-size:12px;font-weight:600;cursor:pointer;transition:all .12s;color:var(--text2);font-family:'JetBrains Mono',monospace;}
.preset:hover{border-color:var(--coral2);color:var(--coral);}
.preset.active{background:var(--coral);border-color:var(--coral);color:#fff;}
.smart-slider-row{display:flex;align-items:center;gap:10px;}
.smart-slider{flex:1;-webkit-appearance:none;appearance:none;height:6px;background:var(--cream3);border-radius:10px;outline:none;}
.smart-slider::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;border:2.5px solid var(--coral);cursor:pointer;box-shadow:0 2px 8px rgba(232,93,58,.25);transition:transform .1s;}
.smart-slider::-webkit-slider-thumb:hover{transform:scale(1.15);}
.smart-num{font-family:'Fraunces',serif;font-size:20px;font-weight:600;color:var(--ink);min-width:52px;text-align:right;}
.smart-unit{font-size:11px;color:var(--text3);font-weight:500;}

/* Mood/Pain sliders */
.mood-slider{-webkit-appearance:none;appearance:none;width:100%;height:8px;border-radius:10px;outline:none;cursor:pointer;margin:8px 0;}
.mood-slider.mood{background:linear-gradient(90deg,var(--coralL) 0%,var(--amberL) 50%,var(--sageL) 100%);}
.mood-slider.mood::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;border:2.5px solid var(--sage);cursor:pointer;box-shadow:0 2px 8px rgba(58,122,90,.3);}
.mood-slider.pain{background:linear-gradient(90deg,var(--sageL) 0%,var(--amberL) 50%,var(--coralL) 100%);}
.mood-slider.pain::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;border:2.5px solid var(--rose);cursor:pointer;box-shadow:0 2px 8px rgba(196,74,106,.3);}
.mood-row{display:flex;align-items:center;gap:12px;}
.mood-val{font-family:'Fraunces',serif;font-size:22px;font-weight:700;min-width:30px;text-align:center;}
.mood-emoji-row{display:flex;justify-content:space-between;font-size:16px;margin-top:2px;}

/* Toggle */
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;}
.toggle-text{font-size:14px;font-weight:500;color:var(--text);}
.toggle-sub{font-size:11px;color:var(--text3);margin-top:1px;}
.sw{position:relative;width:50px;height:28px;flex-shrink:0;}
.sw input{opacity:0;width:0;height:0;}
.sw-track{position:absolute;inset:0;background:var(--cream3);border-radius:50px;cursor:pointer;transition:all .25s;border:1.5px solid var(--warmD);}
.sw-track::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--text3);transition:all .25s;}
.sw input:checked+.sw-track{background:var(--sage);border-color:var(--sage);}
.sw input:checked+.sw-track::after{transform:translateX(22px);background:#fff;}

/* Save btn */
.save-btn{
  width:100%;padding:16px;border-radius:var(--r);border:none;
  background:linear-gradient(135deg,var(--coral),var(--rose));
  color:#fff;font-family:'Fraunces',serif;font-size:17px;font-weight:600;
  cursor:pointer;transition:all .2s;letter-spacing:.02em;
  box-shadow:0 4px 20px rgba(232,93,58,.3);margin-top:4px;
}
.save-btn:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(232,93,58,.4);}
.save-btn:active{transform:none;}

/* ===== HISTORY VIEW ===== */
#history-view{display:none;}
.hist-filters{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
.hist-filter-chip{padding:7px 16px;border-radius:50px;border:1.5px solid var(--cream3);background:#fff;
  font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;color:var(--text2);}
.hist-filter-chip.active{background:var(--ink);border-color:var(--ink);color:#fff;}
.hist-list{display:flex;flex-direction:column;gap:12px;}
.hist-entry{background:#fff;border:1.5px solid var(--warm);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);}
.hist-entry-header{display:flex;align-items:center;gap:16px;padding:16px 20px;cursor:pointer;transition:background .15s;}
.hist-entry-header:hover{background:var(--cream2);}
.hist-date-col{min-width:110px;}
.hist-date{font-family:'Fraunces',serif;font-size:16px;font-weight:600;color:var(--ink);}
.hist-dow{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;}
.hist-score-badge{width:52px;height:52px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-direction:column;flex-shrink:0;}
.hist-score-num{font-family:'Fraunces',serif;font-size:18px;font-weight:700;line-height:1;}
.hist-score-pct{font-size:9px;text-transform:uppercase;letter-spacing:.06em;opacity:.7;}
.hist-pills-row{display:flex;gap:6px;flex:1;flex-wrap:wrap;align-items:center;}
.hist-pill{padding:4px 10px;border-radius:50px;font-size:11px;font-weight:600;display:flex;align-items:center;gap:4px;}
.hist-expand{color:var(--text3);font-size:18px;transition:transform .2s;margin-left:auto;flex-shrink:0;}
.hist-expand.open{transform:rotate(180deg);}
.hist-body{display:none;padding:0 20px 18px;border-top:1.5px solid var(--cream2);}
.hist-body.open{display:block;}
.hist-detail-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:14px;}
.hist-detail-item{background:var(--cream2);border-radius:var(--r2);padding:12px 14px;}
.hist-detail-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;font-weight:600;margin-bottom:4px;}
.hist-detail-val{font-family:'Fraunces',serif;font-size:16px;font-weight:600;color:var(--ink);}
.hist-detail-bar{height:3px;background:var(--warm);border-radius:3px;margin-top:6px;overflow:hidden;}
.hist-detail-bar-fill{height:100%;border-radius:3px;}

/* ===== CHARTS VIEW ===== */
#stats-view{display:none;}
.chart-builder{background:#fff;border:1.5px solid var(--warm);border-radius:var(--r);padding:24px;margin-bottom:24px;box-shadow:var(--shadow);}
.builder-title{font-family:'Fraunces',serif;font-size:18px;font-weight:600;margin-bottom:4px;}
.builder-sub{font-size:13px;color:var(--text3);margin-bottom:20px;}
.builder-row{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:12px;align-items:end;margin-bottom:12px;}
.builder-select{padding:10px 14px;border-radius:var(--r2);border:1.5px solid var(--cream3);background:var(--cream2);
  font-family:'Bricolage Grotesque',sans-serif;font-size:13px;color:var(--text);outline:none;cursor:pointer;transition:border-color .2s;}
.builder-select:focus{border-color:var(--coral);}
.builder-label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;font-weight:600;margin-bottom:6px;}
.add-chart-btn{padding:10px 20px;border-radius:var(--r2);border:none;background:var(--coral);color:#fff;
  font-family:'Bricolage Grotesque',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap;}
.add-chart-btn:hover{background:var(--rose);}

.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
.chart-card{background:#fff;border:1.5px solid var(--warm);border-radius:var(--r);padding:22px;box-shadow:var(--shadow);position:relative;animation:fadeUp .3s ease both;}
.chart-card.span2{grid-column:1/-1;}
.chart-card-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px;}
.chart-card-title{font-family:'Fraunces',serif;font-size:15px;font-weight:600;}
.chart-card-sub{font-size:11px;color:var(--text3);margin-top:2px;}
.chart-del{width:26px;height:26px;border-radius:6px;border:1.5px solid var(--cream3);background:transparent;
  cursor:pointer;color:var(--text3);font-size:14px;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.chart-del:hover{background:var(--coralL);border-color:var(--coral);color:var(--coral);}
.chart-wrap{position:relative;height:220px;}
.chart-wrap.tall{height:280px;}
.chart-empty{height:200px;display:flex;align-items:center;justify-content:center;color:var(--text4);font-size:14px;font-style:italic;}

/* Insight cards */
.insights{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px;}
.insight-card{background:#fff;border:1.5px solid var(--warm);border-radius:var(--r2);padding:16px;box-shadow:var(--shadow);}
.insight-label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;font-weight:600;margin-bottom:6px;}
.insight-val{font-family:'Fraunces',serif;font-size:24px;font-weight:700;color:var(--ink);line-height:1;}
.insight-sub{font-size:12px;color:var(--text2);margin-top:4px;}
.insight-trend{font-size:12px;font-weight:600;margin-top:4px;}

/* Toast */
.toast{position:fixed;bottom:24px;right:24px;padding:14px 22px;border-radius:var(--r2);
  background:var(--ink);color:#fff;font-size:14px;font-weight:600;
  transform:translateY(60px);opacity:0;transition:all .3s cubic-bezier(.4,0,.2,1);z-index:999;
  box-shadow:var(--shadow2);}
.toast.show{transform:none;opacity:1;}
.toast.success{background:var(--sage);}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(26,21,16,.5);display:flex;align-items:center;justify-content:center;
  z-index:200;opacity:0;pointer-events:none;transition:opacity .2s;backdrop-filter:blur(3px);}
.overlay.open{opacity:1;pointer-events:all;}
.modal{background:#fff;border-radius:var(--r);padding:32px;max-width:440px;width:90%;
  transform:scale(.95) translateY(8px);transition:transform .2s;border:1.5px solid var(--warm);box-shadow:var(--shadow2);}
.overlay.open .modal{transform:none;}
.modal h3{font-family:'Fraunces',serif;font-size:20px;font-weight:700;margin-bottom:6px;}
.modal p{font-size:13px;color:var(--text2);margin-bottom:20px;line-height:1.6;}
.modal-input{width:100%;padding:10px 14px;border:1.5px solid var(--cream3);border-radius:var(--r2);
  background:var(--cream2);font-family:'Bricolage Grotesque',sans-serif;font-size:14px;color:var(--text);outline:none;margin-bottom:12px;}
.modal-input:focus{border-color:var(--coral);}
.modal-btns{display:flex;gap:10px;margin-top:8px;}
.btn-ok{flex:1;padding:12px;background:var(--coral);border:none;border-radius:var(--r2);color:#fff;
  font-family:'Bricolage Grotesque',sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:background .15s;}
.btn-ok:hover{background:var(--rose);}
.btn-cancel{flex:1;padding:12px;background:transparent;border:1.5px solid var(--cream3);border-radius:var(--r2);
  color:var(--text2);font-family:'Bricolage Grotesque',sans-serif;font-size:14px;cursor:pointer;transition:all .15s;}
.btn-cancel:hover{border-color:var(--warmD);}

/* Section del anim */
.sections .card:nth-child(1){animation-delay:.1s}
.sections .card:nth-child(2){animation-delay:.15s}
.sections .card:nth-child(3){animation-delay:.2s}
.sections .card:nth-child(4){animation-delay:.25s}
.sections .card:nth-child(5){animation-delay:.3s}
.sections .card:nth-child(6){animation-delay:.35s}
.sections .card:nth-child(7){animation-delay:.4s}

/* Streak dots */
.streak-dots{display:flex;gap:3px;flex-wrap:wrap;margin-top:8px;}
.sdot{width:9px;height:9px;border-radius:50%;background:var(--cream3);}
.sdot.hit{background:var(--sage);}
.sdot.miss{background:var(--coral2);opacity:.6;}
.sdot.empty{background:var(--cream3);}

/* ===== FOCUS / POMODORO ===== */
#focus-view{display:none;}
.focus-wrap{max-width:680px;margin:0 auto;}
.pomo-card{background:#fff;border:1.5px solid var(--warm);border-radius:var(--r);padding:48px 40px;text-align:center;box-shadow:var(--shadow2);margin-bottom:20px;position:relative;overflow:hidden;}
.pomo-card::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 80% 60% at 50% 0%,rgba(232,93,58,0.05),transparent 70%);pointer-events:none;}
.pomo-mode-chips{display:flex;justify-content:center;gap:8px;margin-bottom:36px;flex-wrap:wrap;}
.pomo-mode-chip{padding:8px 20px;border-radius:50px;border:1.5px solid var(--cream3);background:var(--cream2);
  font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;color:var(--text2);}
.pomo-mode-chip.active{background:var(--coral);border-color:var(--coral);color:#fff;box-shadow:0 3px 14px rgba(232,93,58,.3);}
.pomo-mode-chip:disabled{opacity:.4;cursor:not-allowed;}
.pomo-ring-wrap{position:relative;width:220px;height:220px;margin:0 auto 32px;}
.pomo-ring-wrap svg{transform:rotate(-90deg);}
.pomo-ring-bg{fill:none;stroke:var(--cream3);stroke-width:12;}
.pomo-ring-fg{fill:none;stroke-width:12;stroke-linecap:round;transition:stroke-dashoffset .9s linear;}
.pomo-ring-pulse{fill:none;stroke-width:12;stroke-linecap:round;opacity:0;}
.pomo-ring-inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;}
.pomo-time{font-family:'Fraunces',serif;font-size:52px;font-weight:700;color:var(--ink);letter-spacing:-2px;line-height:1;}
.pomo-phase{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--text3);}
.pomo-session-count{font-size:13px;color:var(--text2);margin-bottom:24px;}
.pomo-session-count strong{color:var(--coral);font-family:'Fraunces',serif;font-size:15px;}
.pomo-btns{display:flex;gap:12px;justify-content:center;margin-bottom:28px;}
.pomo-start{padding:14px 44px;border-radius:50px;border:none;background:linear-gradient(135deg,var(--coral),var(--rose));
  color:#fff;font-family:'Fraunces',serif;font-size:17px;font-weight:600;cursor:pointer;
  transition:all .2s;box-shadow:0 4px 20px rgba(232,93,58,.35);}
.pomo-start:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(232,93,58,.4);}
.pomo-start:disabled{opacity:.5;cursor:not-allowed;transform:none;}
.pomo-skip{padding:14px 24px;border-radius:50px;border:1.5px solid var(--cream3);background:transparent;
  color:var(--text3);font-family:'Bricolage Grotesque',sans-serif;font-size:14px;cursor:pointer;transition:all .2s;}
.pomo-skip:hover{border-color:var(--warmD);color:var(--text2);}
.pomo-skip:disabled{opacity:.3;cursor:not-allowed;}
.pomo-blocker-status{display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;color:var(--text3);}
.blocker-dot{width:8px;height:8px;border-radius:50%;background:var(--cream3);transition:background .3s;}
.blocker-dot.active{background:var(--sage);box-shadow:0 0 0 3px rgba(58,122,90,.2);}
.blocker-dot.inactive{background:var(--text4);}

.pomo-log{background:#fff;border:1.5px solid var(--warm);border-radius:var(--r);padding:22px;box-shadow:var(--shadow);}
.pomo-log-title{font-family:'Fraunces',serif;font-size:16px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;}
.pomo-log-list{display:flex;flex-direction:column;gap:8px;max-height:300px;overflow-y:auto;}
.pomo-log-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--cream2);border-radius:var(--r2);}
.pomo-log-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}
.pomo-log-text{flex:1;font-size:13px;font-weight:500;}
.pomo-log-time{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text3);}

.pomo-settings{background:#fff;border:1.5px solid var(--warm);border-radius:var(--r);padding:22px;box-shadow:var(--shadow);margin-bottom:20px;}
.pomo-settings-title{font-family:'Fraunces',serif;font-size:15px;font-weight:600;margin-bottom:14px;}
.settings-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
.setting-item{background:var(--cream2);border-radius:var(--r2);padding:12px;}
.setting-label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;font-weight:600;margin-bottom:6px;}
.setting-val{font-family:'Fraunces',serif;font-size:20px;font-weight:700;color:var(--ink);}
.setting-btns{display:flex;gap:4px;margin-top:6px;}
.setting-btn{width:26px;height:26px;border-radius:6px;border:1.5px solid var(--cream3);background:#fff;
  cursor:pointer;font-size:14px;font-weight:700;color:var(--text2);transition:all .12s;display:flex;align-items:center;justify-content:center;}
.setting-btn:hover{border-color:var(--coral);color:var(--coral);}
.setting-btn:disabled{opacity:.3;cursor:not-allowed;}

.block-list-card{background:#fff;border:1.5px solid var(--warm);border-radius:var(--r);padding:22px;box-shadow:var(--shadow);margin-bottom:20px;}
.block-domains{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.block-domain{padding:6px 12px;border-radius:50px;background:var(--cream2);border:1.5px solid var(--cream3);
  font-size:12px;font-family:'JetBrains Mono',monospace;color:var(--text2);display:flex;align-items:center;gap:6px;}
.block-domain .x{cursor:pointer;color:var(--text3);font-size:14px;font-weight:700;transition:color .1s;}
.block-domain .x:hover{color:var(--coral);}
.block-add-row{display:flex;gap:8px;margin-top:10px;}
.block-add-input{flex:1;padding:9px 14px;border:1.5px solid var(--cream3);border-radius:var(--r2);
  background:var(--cream2);font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--text);outline:none;}
.block-add-input:focus{border-color:var(--coral);}
.block-add-btn{padding:9px 18px;border-radius:var(--r2);border:none;background:var(--coral);color:#fff;
  font-size:13px;font-weight:600;cursor:pointer;font-family:'Bricolage Grotesque',sans-serif;}

.pomo-locked-overlay{position:fixed;inset:0;background:rgba(26,21,16,.85);z-index:500;display:none;
  flex-direction:column;align-items:center;justify-content:center;backdrop-filter:blur(8px);}
.pomo-locked-overlay.show{display:flex;}
.pomo-locked-box{background:#fff;border-radius:var(--r);padding:48px 40px;text-align:center;max-width:400px;width:90%;box-shadow:var(--shadow2);}
.pomo-locked-time{font-family:'Fraunces',serif;font-size:72px;font-weight:700;color:var(--ink);letter-spacing:-3px;line-height:1;margin:16px 0;}
.pomo-locked-phase{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.15em;color:var(--text3);margin-bottom:8px;}
.pomo-locked-msg{font-size:15px;color:var(--text2);margin-top:12px;line-height:1.6;}
.pomo-locked-ring{margin:0 auto 8px;position:relative;width:160px;height:160px;}
.pomo-locked-ring svg{transform:rotate(-90deg);}
@keyframes pomoPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.85;transform:scale(.99)}}
.pomo-active-pulse{animation:pomoPulse 2s ease infinite;}

@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
@keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}

/* Date switcher */
.date-switcher{display:flex;gap:6px;align-items:center;}
.date-tab{padding:7px 16px;border-radius:50px;border:1.5px solid var(--cream3);background:var(--cream2);
  font-family:'Bricolage Grotesque',sans-serif;font-size:12px;font-weight:600;cursor:pointer;
  transition:all .18s;color:var(--text2);display:flex;flex-direction:column;align-items:center;gap:1px;
  min-width:88px;position:relative;}
.date-tab:hover{border-color:var(--coral2);color:var(--coral);}
.date-tab.active{background:var(--ink);border-color:var(--ink);color:#fff;}
.date-tab-label{font-size:10px;opacity:.75;letter-spacing:.04em;text-transform:uppercase;}
.date-tab-day{font-size:13px;font-weight:700;}
.date-tab-dot{position:absolute;top:5px;right:8px;width:6px;height:6px;border-radius:50%;background:var(--sage2);}
.date-tab.active .date-tab-dot{background:#fff;opacity:.6;}
.editing-banner{background:var(--amberL);border:1.5px solid var(--amber);border-radius:var(--r2);
  padding:9px 16px;margin-bottom:18px;font-size:13px;color:var(--amber);font-weight:600;
  display:none;align-items:center;gap:8px;}
.editing-banner.show{display:flex;}


@media(max-width:1100px){.sections{grid-template-columns:1fr 1fr;}.hero{grid-template-columns:1fr 1fr;}.hero .adal-card{grid-column:1/-1;}}
@media(max-width:800px){.hero{grid-template-columns:1fr;}.sections{grid-template-columns:1fr;}.charts-grid{grid-template-columns:1fr;}.insights{grid-template-columns:1fr 1fr;}.builder-row{grid-template-columns:1fr 1fr;}}
@media(max-width:500px){.nav-tabs{display:none;}.insights{grid-template-columns:1fr;}}

/* ══ MONEY ══════════════════════════════════════ */
.money-grid{display:grid;grid-template-columns:340px 1fr;gap:20px;align-items:start;}
.money-left{display:flex;flex-direction:column;gap:16px;}
.money-right{display:flex;flex-direction:column;gap:16px;}
.mcard{background:#fff;border:1.5px solid var(--warm);border-radius:var(--r);padding:22px;box-shadow:var(--shadow);}
.mcard-title{font-family:'Fraunces',serif;font-size:15px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;}
.mcard-title span{font-size:12px;color:var(--text3);font-family:'JetBrains Mono',monospace;font-weight:400;}

/* Month picker */
.month-nav{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
.month-btn{width:32px;height:32px;border-radius:8px;border:1.5px solid var(--cream3);background:var(--cream2);
  cursor:pointer;font-size:16px;font-weight:700;color:var(--text2);transition:all .15s;display:flex;align-items:center;justify-content:center;}
.month-btn:hover{border-color:var(--coral);color:var(--coral);}
.month-label{flex:1;text-align:center;font-family:'Fraunces',serif;font-size:17px;font-weight:700;color:var(--ink);}
.month-sub{text-align:center;font-size:11px;color:var(--text3);font-family:'JetBrains Mono',monospace;margin-bottom:16px;}

/* Big budget number */
.budget-hero{text-align:center;padding:20px 0 8px;}
.budget-amount{font-family:'Fraunces',serif;font-size:36px;font-weight:800;color:var(--ink);letter-spacing:-1px;line-height:1;}
.budget-unit{font-size:14px;color:var(--text3);margin-top:2px;}
.budget-input-row{display:flex;gap:8px;margin-top:12px;}
.m-input{flex:1;padding:10px 14px;border:1.5px solid var(--cream3);border-radius:var(--r2);
  background:var(--cream2);font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--text);outline:none;transition:border-color .2s;}
.m-input:focus{border-color:var(--coral);}
.m-btn{padding:10px 16px;border-radius:var(--r2);border:none;background:var(--coral);color:#fff;
  font-family:'Bricolage Grotesque',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:background .15s;white-space:nowrap;}
.m-btn:hover{background:var(--rose);}
.m-btn.sage{background:var(--sage);}
.m-btn.sage:hover{background:var(--sage2);}

/* Stat rows */
.stat-rows{display:flex;flex-direction:column;gap:8px;}
.stat-row{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:var(--r2);background:var(--cream2);}
.stat-row-label{font-size:12px;color:var(--text2);font-weight:500;display:flex;align-items:center;gap:6px;}
.stat-row-val{font-family:'Fraunces',serif;font-size:16px;font-weight:700;}
.stat-bar-wrap{height:5px;background:var(--cream3);border-radius:5px;overflow:hidden;margin-top:6px;}
.stat-bar-fill{height:100%;border-radius:5px;transition:width .5s;}

/* Daily limit hero */
.daily-limit-card{background:linear-gradient(135deg,var(--sage),#1a5a3a);border:none;color:#fff;text-align:center;padding:28px 22px;}
.daily-limit-card .mcard-title{color:rgba(255,255,255,.7);justify-content:center;border-bottom:1px solid rgba(255,255,255,.15);padding-bottom:12px;margin-bottom:16px;}
.daily-limit-num{font-family:'Fraunces',serif;font-size:44px;font-weight:800;letter-spacing:-2px;line-height:1;}
.daily-limit-unit{font-size:13px;opacity:.7;margin-top:4px;}
.daily-limit-sub{font-size:12px;opacity:.6;margin-top:8px;}

/* Fixed expenses list */
.fixed-list{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;max-height:320px;overflow-y:auto;}
.fixed-item{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:var(--r2);
  border:1.5px solid var(--cream3);background:var(--cream2);transition:all .2s;}
.fixed-item.checked{background:var(--sageL);border-color:var(--sage2);opacity:.8;}
.fixed-cb{width:18px;height:18px;border-radius:5px;border:2px solid var(--cream3);
  background:#fff;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  transition:all .15s;font-size:11px;}
.fixed-cb.checked{background:var(--sage);border-color:var(--sage);color:#fff;}
.fixed-name{flex:1;font-size:13px;font-weight:500;color:var(--text);}
.fixed-item.checked .fixed-name{text-decoration:line-through;color:var(--text3);}
.fixed-amount{font-family:'Fraunces',serif;font-size:14px;font-weight:700;color:var(--coral);flex-shrink:0;}
.fixed-item.checked .fixed-amount{color:var(--sage);}
.fixed-del{width:24px;height:24px;border-radius:5px;border:none;background:transparent;cursor:pointer;
  color:var(--text4);font-size:14px;transition:all .15s;display:flex;align-items:center;justify-content:center;}
.fixed-del:hover{background:var(--coralL);color:var(--coral);}
.fixed-postpone{width:24px;height:24px;border-radius:5px;border:1.5px solid var(--cream3);background:transparent;cursor:pointer;
  color:var(--text3);font-size:13px;font-weight:700;transition:all .15s;display:flex;align-items:center;justify-content:center;}
.fixed-postpone:hover{background:var(--amberL);border-color:var(--amber);color:var(--amber);}
.fixed-add-row{display:flex;flex-direction:column;gap:8px;padding-top:14px;border-top:1.5px solid var(--cream2);}

/* Daily spending grid */
.days-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.day-cell{border-radius:8px;border:1.5px solid var(--cream3);background:var(--cream2);padding:6px 5px;
  text-align:center;cursor:pointer;transition:all .15s;min-height:52px;position:relative;}
.day-cell:hover{border-color:var(--coral2);}
.day-cell.today{border-color:var(--coral);background:var(--coralL);}
.day-cell.has-data{border-color:var(--sage2);background:var(--sageL);}
.day-cell.future{opacity:.35;cursor:default;}
.day-cell.empty-pad{background:transparent;border-color:transparent;cursor:default;}
.day-num{font-family:'Fraunces',serif;font-size:13px;font-weight:700;color:var(--text2);}
.day-cell.today .day-num{color:var(--coral);}
.day-spend{font-size:9px;color:var(--text3);margin-top:2px;line-height:1.2;font-family:'JetBrains Mono',monospace;}
.day-cell.has-data .day-spend{color:var(--sage);}
.dow-header{text-align:center;font-size:10px;font-weight:700;color:var(--text4);text-transform:uppercase;letter-spacing:.06em;padding:4px 0;}

/* Day edit modal */
.day-modal{max-width:360px;}
.day-modal .presets{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px;}
.day-modal .preset{padding:5px 11px;border-radius:50px;border:1.5px solid var(--cream3);background:var(--cream2);
  font-size:12px;font-weight:600;cursor:pointer;transition:all .12s;color:var(--text2);font-family:'JetBrains Mono',monospace;}
.day-modal .preset:hover{border-color:var(--coral2);color:var(--coral);}
.day-modal .preset.active{background:var(--coral);border-color:var(--coral);color:#fff;}

/* Money charts */
.money-charts{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:4px;}
.mchart-card{background:#fff;border:1.5px solid var(--warm);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);}
.mchart-title{font-family:'Fraunces',serif;font-size:14px;font-weight:700;margin-bottom:4px;}
.mchart-sub{font-size:11px;color:var(--text3);margin-bottom:14px;}
.mchart-wrap{height:180px;position:relative;}

/* Indicators row */
.money-indicators{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;}
.mindic{background:#fff;border:1.5px solid var(--warm);border-radius:var(--r2);padding:14px 16px;box-shadow:var(--shadow);}
.mindic-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;font-weight:600;margin-bottom:5px;}
.mindic-val{font-family:'Fraunces',serif;font-size:22px;font-weight:800;color:var(--ink);line-height:1;}
.mindic-sub{font-size:11px;color:var(--text2);margin-top:3px;}
.mindic-trend{font-size:11px;font-weight:700;margin-top:3px;}

@media(max-width:1000px){.money-grid{grid-template-columns:1fr;}.money-charts{grid-template-columns:1fr;}.money-indicators{grid-template-columns:1fr 1fr;}}

/* ══ FOOD LOG ═══════════════════════════════════ */
.food-grid{display:grid;grid-template-columns:320px 1fr;gap:20px;align-items:start;}
.food-date-bar{display:flex;align-items:center;gap:10px;margin-bottom:20px;background:#fff;border:1.5px solid var(--warm);border-radius:var(--r);padding:14px 18px;box-shadow:var(--shadow);}
.food-date-btn{width:32px;height:32px;border-radius:8px;border:1.5px solid var(--cream3);background:var(--cream2);cursor:pointer;font-size:16px;font-weight:700;color:var(--text2);transition:all .15s;display:flex;align-items:center;justify-content:center;}
.food-date-btn:hover{border-color:var(--coral);color:var(--coral);}
.food-date-label{flex:1;text-align:center;font-family:'Fraunces',serif;font-size:17px;font-weight:700;}
.food-date-sub{font-size:11px;color:var(--text3);font-family:'JetBrains Mono',monospace;}

.meal-block{background:#fff;border:1.5px solid var(--warm);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);margin-bottom:14px;}
.meal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;padding-bottom:12px;border-bottom:1.5px solid var(--cream2);}
.meal-title{font-family:'Fraunces',serif;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;}
.meal-add-btn{padding:6px 14px;border-radius:50px;border:1.5px solid var(--cream3);background:var(--cream2);font-size:12px;font-weight:600;color:var(--text2);cursor:pointer;transition:all .15s;}
.meal-add-btn:hover{border-color:var(--sage2);color:var(--sage);background:var(--sageL);}

.meal-items{display:flex;flex-direction:column;gap:6px;min-height:32px;}
.meal-item{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--cream2);border-radius:var(--r2);border:1.5px solid var(--cream3);}
.meal-item-icon{font-size:18px;flex-shrink:0;}
.meal-item-info{flex:1;}
.meal-item-name{font-size:13px;font-weight:600;color:var(--text);}
.meal-item-detail{font-size:11px;color:var(--text3);margin-top:1px;}
.meal-item-qty{font-family:'Fraunces',serif;font-size:14px;font-weight:700;color:var(--ink);flex-shrink:0;}
.meal-item-del{width:22px;height:22px;border:none;background:transparent;cursor:pointer;color:var(--text4);font-size:15px;border-radius:5px;transition:all .15s;display:flex;align-items:center;justify-content:center;}
.meal-item-del:hover{background:var(--coralL);color:var(--coral);}
.meal-empty{color:var(--text4);font-size:12px;font-style:italic;padding:4px 0;}

.food-macros-card{background:#fff;border:1.5px solid var(--warm);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden;}
.macro-row{display:grid;grid-template-columns:80px 1fr 44px;align-items:center;gap:10px;margin-bottom:10px;}
.macro-label{font-size:12px;font-weight:600;color:var(--text2);}
.macro-input{width:100%;padding:9px 12px;border:1.5px solid var(--cream3);border-radius:var(--r2);background:var(--cream2);font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--text);outline:none;transition:border-color .2s;box-sizing:border-box;}
.macro-input:focus{border-color:var(--coral);}
.macro-unit{font-size:12px;color:var(--text3);text-align:right;}
.macro-sync-badge{font-size:10px;background:var(--sageL);color:var(--sage);padding:2px 8px;border-radius:50px;font-weight:700;white-space:nowrap;}

.claude-prompt-card{background:linear-gradient(135deg,#1a1510,#2c1f14);border-radius:var(--r);padding:22px;box-shadow:var(--shadow2);margin-bottom:14px;color:#fff;}
.claude-prompt-title{font-family:'Fraunces',serif;font-size:15px;font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:8px;}
.claude-prompt-sub{font-size:12px;opacity:.6;margin-bottom:14px;}
.claude-prompt-box{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:var(--r2);padding:14px;font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.6;color:rgba(255,255,255,.85);white-space:pre-wrap;max-height:200px;overflow-y:auto;margin-bottom:12px;}
.claude-copy-btn{padding:10px 20px;border-radius:var(--r2);border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:#fff;font-family:'Bricolage Grotesque',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;width:100%;}
.claude-copy-btn:hover{background:rgba(255,255,255,.18);}

.ingr-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;max-height:280px;overflow-y:auto;}
.ingr-card{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--cream2);border:1.5px solid var(--cream3);border-radius:var(--r2);cursor:pointer;transition:all .15s;}
.ingr-card:hover{border-color:var(--sage2);background:var(--sageL);}
.ingr-card-icon{font-size:20px;flex-shrink:0;}
.ingr-card-info{flex:1;min-width:0;}
.ingr-card-name{font-size:12px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ingr-card-unit{font-size:10px;color:var(--text3);}
.ingr-card-del{width:20px;height:20px;border:none;background:transparent;cursor:pointer;color:var(--text4);font-size:14px;border-radius:4px;transition:all .12s;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.ingr-card-del:hover{background:var(--coralL);color:var(--coral);}

/* Add item modal */
.food-modal{max-width:440px;}
.qty-presets{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px;}

.food-notes{width:100%;padding:10px 14px;border:1.5px solid var(--cream3);border-radius:var(--r2);background:var(--cream2);font-family:'Bricolage Grotesque',sans-serif;font-size:13px;color:var(--text);outline:none;resize:vertical;min-height:70px;transition:border-color .2s;}
.food-notes:focus{border-color:var(--coral);}

@media(max-width:1000px){.food-grid{grid-template-columns:1fr;}.ingr-grid{grid-template-columns:1fr 1fr 1fr;}}
@media(max-width:600px){.ingr-grid{grid-template-columns:1fr 1fr;}}

/* ══ CALENDAR ══════════════════════════════════ */
.cal-wrap{display:grid;grid-template-columns:1fr 320px;gap:20px;align-items:start;}
.cal-main{background:#fff;border:1.5px solid var(--warm);border-radius:var(--r);padding:24px;box-shadow:var(--shadow);}
.cal-header{display:flex;align-items:center;gap:12px;margin-bottom:20px;}
.cal-nav-btn{width:36px;height:36px;border-radius:10px;border:1.5px solid var(--cream3);background:var(--cream2);
  cursor:pointer;font-size:18px;font-weight:700;color:var(--text2);transition:all .15s;display:flex;align-items:center;justify-content:center;}
.cal-nav-btn:hover{border-color:var(--coral);color:var(--coral);}
.cal-month-label{flex:1;text-align:center;font-family:'Fraunces',Georgia,serif;font-size:20px;font-weight:700;color:var(--ink);}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.cal-dow{text-align:center;font-size:10px;font-weight:700;color:var(--text4);text-transform:uppercase;letter-spacing:.06em;padding:6px 0;}
.cal-day{border-radius:10px;border:1.5px solid transparent;background:var(--cream2);padding:6px 5px;
  min-height:72px;cursor:pointer;transition:all .15s;position:relative;overflow:hidden;}
.cal-day:hover{border-color:var(--coral2);background:#fff;}
.cal-day.today{border-color:var(--coral);background:var(--coralL);}
.cal-day.other-month{opacity:.3;cursor:default;}
.cal-day.has-events{border-color:var(--sky);}
.cal-day.score-great{background:#e2f0ea;}
.cal-day.score-good{background:#fef3e2;}
.cal-day.score-low{background:#fde8e2;}
.cal-day.adal-day{border-color:var(--rose)!important;border-width:2px!important;}
.cal-day-num{font-family:'Fraunces',Georgia,serif;font-size:13px;font-weight:700;color:var(--text2);}
.cal-day.today .cal-day-num{color:var(--coral);}
.cal-day-score{font-size:9px;color:var(--text3);font-family:'JetBrains Mono',monospace;margin-top:1px;}
.cal-events{display:flex;flex-direction:column;gap:2px;margin-top:4px;}
.cal-event-dot{border-radius:4px;padding:1px 5px;font-size:9px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff;}
.cal-adal-dot{background:var(--rose);}
.cal-side{display:flex;flex-direction:column;gap:14px;}
.cal-add-card{background:#fff;border:1.5px solid var(--warm);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);}
.cal-add-title{font-family:'Fraunces',Georgia,serif;font-size:15px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;}
.cal-add-title span{font-size:11px;color:var(--text3);font-weight:400;font-family:'JetBrains Mono',monospace;}
.cal-priority{display:flex;gap:6px;margin-bottom:12px;}
.cal-pri-btn{flex:1;padding:7px;border-radius:8px;border:1.5px solid var(--cream3);background:var(--cream2);
  font-size:11px;font-weight:700;cursor:pointer;transition:all .15s;text-align:center;}
.cal-pri-btn.sel{color:#fff;}
.cal-pri-btn.p1.sel{background:var(--coral);border-color:var(--coral);}
.cal-pri-btn.p2.sel{background:var(--amber);border-color:var(--amber);}
.cal-pri-btn.p3.sel{background:var(--sage);border-color:var(--sage);}
.cal-events-list{display:flex;flex-direction:column;gap:8px;max-height:500px;overflow-y:auto;}
.cal-ev-item{display:flex;align-items:flex-start;gap:10px;padding:11px 13px;border-radius:var(--r2);
  border:1.5px solid var(--cream3);background:var(--cream2);transition:all .2s;}
.cal-ev-item.done{opacity:.55;}
.cal-ev-item.done .cal-ev-title{text-decoration:line-through;color:var(--text3);}
.cal-ev-cb{width:18px;height:18px;border-radius:5px;border:2px solid var(--cream3);background:#fff;
  cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;margin-top:1px;}
.cal-ev-cb.done{background:var(--sage);border-color:var(--sage);color:#fff;}
.cal-ev-body{flex:1;min-width:0;}
.cal-ev-title{font-size:13px;font-weight:600;color:var(--text);}
.cal-ev-date{font-size:10px;color:var(--text3);font-family:'JetBrains Mono',monospace;margin-top:2px;}
.cal-ev-del{border:none;background:transparent;cursor:pointer;color:var(--text4);font-size:16px;padding:0;transition:color .15s;flex-shrink:0;}
.cal-ev-del:hover{color:var(--coral);}
.cal-ev-pri{width:5px;border-radius:3px;align-self:stretch;flex-shrink:0;}
.cal-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--text3);padding:10px 0 0;}
.cal-leg-dot{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:4px;vertical-align:middle;}
@media(max-width:900px){.cal-wrap{grid-template-columns:1fr;}}


/* ══ SLEEP ═══════════════════════════════════════ */
.sleep-grid{display:grid;grid-template-columns:340px 1fr;gap:20px;align-items:start;}
.sleep-log-card{background:#fff;border:1.5px solid var(--warm);border-radius:var(--r);padding:22px;box-shadow:var(--shadow);}
.sleep-time-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.sleep-time-input{padding:12px;border:1.5px solid var(--cream3);border-radius:var(--r2);background:var(--cream2);
  font-family:'JetBrains Mono',monospace;font-size:18px;color:var(--text);outline:none;text-align:center;font-weight:700;width:100%;}
.sleep-time-input:focus{border-color:var(--coral);}
.sleep-time-label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin-bottom:6px;text-align:center;}
.sleep-duration-display{text-align:center;background:var(--skyL);border-radius:var(--r2);padding:14px;margin-bottom:14px;}
.sleep-duration-num{font-family:'Fraunces',Georgia,serif;font-size:28px;font-weight:800;color:var(--sky);}
.sleep-duration-sub{font-size:11px;color:var(--text3);margin-top:2px;}
.sleep-score-display{text-align:center;border-radius:var(--r2);padding:12px;margin-bottom:14px;}
.sleep-quality-row{margin-bottom:14px;}
.sleep-indicators{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px;}
.sleep-day-card{background:#fff;border:1.5px solid var(--warm);border-radius:var(--r2);padding:12px 14px;margin-bottom:6px;display:flex;align-items:center;gap:10px;}
.sleep-day-bar{flex:1;height:24px;background:var(--cream2);border-radius:6px;position:relative;overflow:hidden;}

/* ══ METRIC PICKER (stats) ═══════════════════════ */
.b-y-grid{display:flex;flex-wrap:wrap;gap:10px;padding:6px 0;}
.b-y-group{display:flex;flex-direction:column;gap:4px;min-width:130px;}
.b-y-group-label{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;padding-bottom:3px;border-bottom:1px solid var(--warm2);margin-bottom:2px;}
.b-y-check-label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2);cursor:pointer;padding:3px 0;user-select:none;}
.b-y-check-label:hover{color:var(--text1);}
.b-y-check-label input{accent-color:var(--coral);width:13px;height:13px;cursor:pointer;}
.b-y-swatch{width:8px;height:8px;border-radius:50%;flex-shrink:0;}

/* ══ HISTORY SECTIONS ════════════════════════════ */
.hist-detail-grid-inner{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.hist-section-title{display:block;}
@media(max-width:700px){.hist-detail-grid-inner{grid-template-columns:repeat(2,1fr);}}


</style>
